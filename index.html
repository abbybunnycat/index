<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbbyBunnyCat 的夢幻測驗與工具大廳 🐾✨</title>
    
    <meta property="og:title" content="AbbyBunnyCat 的夢幻測驗與工具大廳 🐾✨">
    <meta property="og:description" content="快來和可愛小動物一起探索各種神秘占卜、心靈測驗、學習資源與生活實用小工具吧！">
    <meta property="og:type" content="website">

    <style>
        /* Google Fonts 引入可愛圓體 */
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #fff9fb;
            /* 甜美背景波點圖案 */
            background-image: 
                radial-gradient(#ffd6e7 15%, transparent 16%),
                radial-gradient(#e0f2fe 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #5a4b51;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 頂部 Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        header h1 {
            color: #ff6b9d;
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffd2e1;
        }

        header p {
            color: #8a737d;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        }

        /* 主要目錄區域 */
        main {
            max-width: 1100px;
            width: 100%;
        }

        .category-section {
            margin-bottom: 45px;
        }

        /* 目錄標題樣式 */
        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff5e97;
            background-color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 22px;
            border-radius: 30px;
            border: 2px dashed #ffb6c1;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
        }

        /* 卡片網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* 卡片本體 */
        .card {
            background-color: #ffffff;
            border: 3px solid #ffe3ec;
            border-radius: 24px;
            padding: 30px 20px 25px 20px;
            text-decoration: none;
            color: #5a4b51;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #ff9ebb;
            box-shadow: 0 15px 30px rgba(255, 158, 187, 0.3);
        }

        /* 卡片內的標籤 Badge */
        .new-badge {
            position: absolute;
            top: -12px;
            right: 15px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(255, 117, 140, 0.4);
        }

        /* 卡片圖示與標題 */
        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .card h2 {
            font-size: 1.35rem;
            color: #ff4d8d;
            margin-bottom: 8px;
            font-weight: 700;
        }
